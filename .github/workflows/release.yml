name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
            binary: rosella.exe
          - os: ubuntu-latest
            name: linux
            binary: rosella
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --bin rosella

      # Zip Binary
      - name: Package
        shell: bash
        run: |
          mkdir package
          cp "target/release/${{ matrix.binary }}" LICENSE package/
          cd package
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../rosella-${{ matrix.name }}.zip" ./*
          else
            zip "../rosella-${{ matrix.name }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rosella-${{ matrix.name }}
          path: rosella-${{ matrix.name }}.zip

  release:
    name: Draft Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # Changelog Section
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section headed '## ${version}'" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.zip \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
